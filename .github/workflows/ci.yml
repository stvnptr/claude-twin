name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sandboxed install/uninstall tests
        run: bash tests/test.sh
